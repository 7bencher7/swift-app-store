services:
  swift-setup:
    image: swift-setup:0.1.0
    pull_policy: never
    container_name: ${APP_ID}_setup_1
    restart: unless-stopped
    environment:
      PORT: 3010
      CONFIG_PATH: /data/swift-config.json
      SETUP_ADMIN_USER: swiftadmin
      SETUP_ADMIN_PASSWORD: "21ee94bfc6d4e249329482a4ee745b60af8236538a931ab7"
    ports:
      - "3010:3010"
    volumes:
      - ${APP_DATA_DIR}/data/setup:/data

  chatwoot-postgres:
    image: pgvector/pgvector:pg15
    container_name: ${APP_ID}_chatwoot_postgres_1
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: "d63cfe9d1a2f99a48e88597ffd090be050dd9d18c68f00d3655be33999a36fe5"
    volumes:
      - ${APP_DATA_DIR}/data/chatwoot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 20

  chatwoot-redis:
    image: redis:7-alpine
    container_name: ${APP_ID}_chatwoot_redis_1
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${APP_DATA_DIR}/data/chatwoot-redis:/data

  chatwoot-init:
    image: chatwoot/chatwoot:latest
    container_name: ${APP_ID}_chatwoot_init_1
    restart: "no"
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    environment:
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: "d63cfe9d1a2f99a48e88597ffd090be050dd9d18c68f00d3655be33999a36fe5"
      POSTGRES_HOST: chatwoot-postgres
      REDIS_URL: redis://chatwoot-redis:6379
      SECRET_KEY_BASE: "93d4e5e7296f3a4ce0ac80bcc939679bcff1a2b1f6cfb01428a077dc270855fc64f981682cb36228ad0c2ec9a0d949919b3074ada534492d65cf431b2841d14e"
      FRONTEND_URL: "http://umbrel.local:3001"
      INSTALLATION_NAME: Swift
      RAILS_ENV: production
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]

  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: ${APP_ID}_chatwoot_1
    restart: unless-stopped
    depends_on:
      chatwoot-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: "d63cfe9d1a2f99a48e88597ffd090be050dd9d18c68f00d3655be33999a36fe5"
      POSTGRES_HOST: chatwoot-postgres
      REDIS_URL: redis://chatwoot-redis:6379
      SECRET_KEY_BASE: "93d4e5e7296f3a4ce0ac80bcc939679bcff1a2b1f6cfb01428a077dc270855fc64f981682cb36228ad0c2ec9a0d949919b3074ada534492d65cf431b2841d14e"
      FRONTEND_URL: "http://umbrel.local:3001"
      INSTALLATION_NAME: Swift
      RAILS_ENV: production
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
    ports:
      - "3001:3000"
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    container_name: ${APP_ID}_chatwoot_worker_1
    restart: unless-stopped
    depends_on:
      chatwoot-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: "d63cfe9d1a2f99a48e88597ffd090be050dd9d18c68f00d3655be33999a36fe5"
      POSTGRES_HOST: chatwoot-postgres
      REDIS_URL: redis://chatwoot-redis:6379
      SECRET_KEY_BASE: "93d4e5e7296f3a4ce0ac80bcc939679bcff1a2b1f6cfb01428a077dc270855fc64f981682cb36228ad0c2ec9a0d949919b3074ada534492d65cf431b2841d14e"
      FRONTEND_URL: "http://umbrel.local:3001"
      INSTALLATION_NAME: Swift
      RAILS_ENV: production
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  evolution-postgres:
    image: postgres:15-alpine
    container_name: ${APP_ID}_evolution_postgres_1
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: "f25a61198084ad8b6e3fd36f825eb8533cf4c3a8de75c513e835372351ca007e"
    volumes:
      - ${APP_DATA_DIR}/data/evolution-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20

  evolution-redis:
    image: redis:7-alpine
    container_name: ${APP_ID}_evolution_redis_1
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${APP_DATA_DIR}/data/evolution-redis:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: ${APP_ID}_evolution_api_1
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SERVER_URL: "http://umbrel.local:8083"
      AUTHENTICATION_API_KEY: "0b700aa71da86c53809940a707ed76714d3f3569bb402fe6b66a1b56b974e98e"
      LANGUAGE: en
      TZ: Africa/Nairobi
      LOG_LEVEL: ERROR
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      CHATWOOT_ENABLED: "true"
      CHATWOOT_MESSAGE_READ: "true"
      CHATWOOT_MESSAGE_DELETE: "true"
      CHATWOOT_BOT_CONTACT: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evolution:f25a61198084ad8b6e3fd36f825eb8533cf4c3a8de75c513e835372351ca007e@evolution-postgres:5432/evolution"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    ports:
      - "8083:8080"
